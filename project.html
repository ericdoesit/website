<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project</title>
  <link rel="preload" href="fonts/PPKyoto-Medium.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/PPMori-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/PPMori-SemiBold.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="projects.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id') || 'a-little-flexibility';
    const p = window.PROJECTS[id];
    if (!p) location.href = 'index.html';
    document.documentElement.style.setProperty('--project-color', p.color);
    document.title = p.title.replace('\n', ' ');
  </script>
</head>
<body>
<div class="page">

  <div class="section-header fade-in">
    <span class="section-header__label" id="project-category">Project</span>
    <div class="section-header__line"></div>
  </div>

  <div class="intro fade-in">
    <h1 class="intro__title" id="project-title"></h1>
    <p class="intro__deliverable" id="project-deliverable"></p>
    <div class="intro__csl">
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Challenge</span>
        <p class="intro__csl-body" id="project-challenge"></p>
      </div>
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Solution</span>
        <p class="intro__csl-body" id="project-solution"></p>
      </div>
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Logic</span>
        <p class="intro__csl-body" id="project-logic"></p>
      </div>
    </div>
  </div>

  <div class="image-grid fade-in" id="image-grid">
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
  </div>

  <p class="image-note fade-in" id="image-note"></p>

  <div class="movie-section fade-in">
    <div class="section-header fade-in">
      <span class="section-header__label" id="motion-label">Motion</span>
      <div class="section-header__line"></div>
    </div>
    <p class="motion-intro" id="motion-intro"></p>
    <div class="motion-concepts" id="motion-concepts"></div>
    <div id="movie-media"><div class="movie-placeholder"></div></div>
  </div>

  <footer class="page-footer">
    <div class="footer-line"></div>
    <a class="footer-btn" href="index.html">Back to Work</a>
    <div class="footer-line"></div>
  </footer>

</div>
<script>
  const titleHTML = p.title.replace('\n', '<br>');
  document.getElementById('project-category').textContent = p.categoryLabel || p.tags.map(t => t.charAt(0).toUpperCase() + t.slice(1)).join(' / ');
  document.getElementById('project-title').innerHTML = titleHTML;
  document.getElementById('project-deliverable').textContent = p.deliverable || '';
  document.getElementById('project-challenge').textContent = p.challenge || '';
  document.getElementById('project-solution').textContent = p.solution || '';
  document.getElementById('project-logic').textContent = p.logic || '';
  if (p.imageNote) {
    document.getElementById('image-note').textContent = p.imageNote;
  }

  if (p.motionSection) {
    document.getElementById('motion-label').textContent = 'Motion';
    document.getElementById('motion-intro').style.display = 'none';
    document.getElementById('motion-concepts').innerHTML = (p.motionSection.concepts || [])
      .map(c => `<div><p class="motion-concept__title">${c.title}</p><p class="motion-concept__body">${c.body}</p></div>`)
      .join('');
  } else {
    if (!p.videos || !p.videos.length) {
      document.querySelector('.movie-section').style.display = 'none';
    } else {
      if (p.categoryLabel === 'Motion') {
        document.querySelector('.movie-section .section-header').style.display = 'none';
      }
      document.getElementById('motion-intro').style.display = 'none';
      document.getElementById('motion-concepts').style.display = 'none';
    }
  }

  if (p.images && p.images.length) {
    const grid = document.getElementById('image-grid');
    if (p.imageColumns) grid.style.setProperty('--image-columns', p.imageColumns);
    if (p.imageMaxHeight) { grid.style.setProperty('--image-max-height', `${p.imageMaxHeight}px`); grid.classList.add('image-grid--capped'); }
    grid.innerHTML = p.images
      .map(src => `<img class="image-thumb" src="${src}" loading="eager" alt="">`)
      .join('');
  } else {
    document.getElementById('image-grid').style.display = 'none';
  }

  if (p.videos && p.videos.length) {
    const media = document.getElementById('movie-media');
    if (p.videoMaxHeight) {
      const [rw, rh] = (p.videos[0].ratio || '16/9').split('/').map(Number);
      const maxW = Math.round(p.videoMaxHeight * rw / rh);
      media.style.gridTemplateColumns = '1fr';
      media.style.maxWidth = `${maxW}px`;
      media.style.margin = '0 auto';
    }
    media.innerHTML = p.videos
      .map(v => {
        const [rw, rh] = (v.ratio || '16/9').split('/').map(Number);
        const span = rw > rh ? 'grid-column:1/-1;' : '';
        return `<div class="video-embed" style="${span}aspect-ratio:${v.ratio || '16/9'}"><iframe src="https://player.vimeo.com/video/${v.id}?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`;
      })
      .join('');
  }

  function renderBlock(block) {
    switch (block.type) {
      case 'video':
        return `<div class="section-block-video fade-in"><div class="video-embed" style="aspect-ratio:${block.ratio||'16/9'}"><iframe src="https://player.vimeo.com/video/${block.id}?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div></div>`;
      case 'credits':
        return `<div class="credits-block fade-in"><p class="credits-label">Credits</p>${block.lines.map(l=>`<p>${l}</p>`).join('')}</div>`;
      case 'text':
        return `<p class="section-text fade-in">${block.body}</p>`;
      case 'images': {
        const cols = block.columns || 2;
        return `<div class="image-grid fade-in" style="grid-template-columns:repeat(${cols},1fr)">${block.items.map(src=>`<img class="image-thumb" src="${src}" loading="lazy" alt="">`).join('')}</div>`;
      }
      case 'quote':
        return `<div class="quote-block fade-in"><p>${block.text}</p></div>`;
      case 'caption':
        return `<p class="section-caption fade-in">${block.body}</p>`;
    }
    return '';
  }

  function renderSection(sec, i) {
    const header = !sec.label ? '' : `<div class="section-header fade-in"><span class="section-header__label">${sec.label}</span><div class="section-header__line"></div></div>`;
    return header + sec.blocks.map(renderBlock).join('');
  }

  if (p.sections) {
    document.getElementById('image-grid').style.display = 'none';
    document.getElementById('image-note').style.display = 'none';
    document.querySelector('.movie-section').style.display = 'none';
    document.querySelector('.page-footer').insertAdjacentHTML('beforebegin', p.sections.map((sec, i) => renderSection(sec, i)).join(''));
  }

</script>
<script src="animations.js"></script>
</body>
</html>
