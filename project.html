<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project</title>
  <link rel="preload" href="fonts/PPKyoto-Medium.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/PPMori-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/PPMori-SemiBold.otf" as="font" type="font/otf" crossorigin>
  <script src="projects.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id') || 'a-little-flexibility';
    const p = window.PROJECTS[id];
    if (!p) location.href = 'index.html';
    document.documentElement.style.setProperty('--project-color', p.color);
    document.title = p.title.replace('\n', ' ');
  </script>
  <style>
    @font-face {
      font-family: 'PP Kyoto';
      src: url('fonts/PPKyoto-Medium.otf') format('opentype');
      font-weight: 500;
    }
    @font-face {
      font-family: 'PP Mori';
      src: url('fonts/PPMori-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'PP Mori';
      src: url('fonts/PPMori-SemiBold.otf') format('opentype');
      font-weight: 600;
    }
  </style>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --project-color: #ad2c1c;
    }

    body {
      background: #fff;
      color: #000;
      font-family: 'PP Mori', sans-serif;
    }

    .page {
      max-width: 1440px;
      margin: 0 auto;
    }

    .fade-in {
      opacity: 0;
      filter: blur(10px);
      transition: opacity 0.8s ease-out, filter 0.8s ease-out;
    }

    .fade-in.animate-in {
      opacity: 1;
      filter: blur(0px);
    }

    /* ── Header / back arrow ─────────────────── */
    .header {
      height: 140px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #000;
    }

    .back-link svg {
      width: 80px;
      height: 50px;
    }

    /* ── Section header (pill + line) ───────── */
    .section-header {
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 115px;
    }

    .section-header__label {
      font-size: 24px;
      font-weight: 600;
      border: 1.5px solid #000;
      border-radius: 999px;
      padding: 14px 22px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1;
    }

    .section-header__line {
      flex: 1;
      height: 1px;
      background: #000;
      margin-left: 6px;
    }

    /* ── Intro block ─────────────────────────── */
    .intro {
      padding: 20px 20px 60px;
    }

    .intro__title {
      font-family: 'PP Kyoto', sans-serif;
      font-size: clamp(42px, 6.67vw, 96px);
      font-weight: 700;
      line-height: 0.88;
      max-width: 779px;
      text-transform: capitalize;
      margin-bottom: 16px;
    }

    .intro__deliverable {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 48px;
    }

    .intro__csl {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
    }

    .intro__csl-item {
      border-top: 1px solid #000;
      padding-top: 16px;
    }

    .intro__csl-label {
      display: block;
      font-size: 16px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .intro__csl-body {
      font-size: 16px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .intro__csl { grid-template-columns: 1fr; }
    }

    /* ── Image grids ─────────────────────────── */
    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 20px 20px;
    }

    .image-thumb {
      background: var(--project-color);
      border-radius: 12px;
      aspect-ratio: 16 / 9;
      width: 100%;
      object-fit: cover;
      display: block;
    }

    img.image-thumb {
      aspect-ratio: auto;
      height: auto;
    }

    #movie-media {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 20px;
      justify-items: center;
    }

    .video-embed {
      position: relative;
      aspect-ratio: 4 / 5;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-embed iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* ── Image note ─────────────────────────── */
    .image-note {
      font-size: 13px;
      color: #888;
      padding: 12px 20px 0;
      line-height: 1.4;
    }

    /* ── Movie section ───────────────────────── */
    .movie-section {
      padding-bottom: 40px;
    }

    .movie-placeholder {
      background: var(--project-color);
      border-radius: 12px;
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 1400px;
      margin: 0 20px;
    }

    .motion-intro {
      font-size: 16px;
      line-height: 1.4;
      padding: 0 20px 40px;
    }

    .motion-concepts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 20px 20px 40px;
    }

    .motion-concept__title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .motion-concept__body {
      font-size: 16px;
      line-height: 1.4;
    }

    @media (max-width: 768px) {
      .motion-concepts { grid-template-columns: 1fr; }
    }

    /* ── Footer ─────────────────────────────── */
    .page-footer {
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 115px;
      margin-bottom: 80px;
    }

    .footer-line {
      flex: 1;
      height: 1px;
      background: #000;
    }

    .footer-btn {
      font-size: 24px;
      font-weight: 600;
      border: 1.5px solid #000;
      border-radius: 999px;
      padding: 14px 22px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1;
      text-decoration: none;
      color: #000;
      margin: 0 6px;
      transition: opacity 0.2s;
    }

    .footer-btn:hover { opacity: 0.4; }
  </style>
</head>
<body>
<div class="page">

  <header class="header">
    <a class="back-link" href="index.html" aria-label="Back">
      <svg viewBox="0 0 164 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="158" y1="50" x2="8" y2="50" stroke="black" stroke-width="10" stroke-linecap="round"/>
        <line x1="8" y1="50" x2="58" y2="8" stroke="black" stroke-width="10" stroke-linecap="round"/>
        <line x1="8" y1="50" x2="58" y2="92" stroke="black" stroke-width="10" stroke-linecap="round"/>
      </svg>
    </a>
  </header>

  <div class="section-header fade-in">
    <span class="section-header__label" id="project-category">Project</span>
    <div class="section-header__line"></div>
  </div>

  <div class="intro fade-in">
    <h1 class="intro__title" id="project-title"></h1>
    <p class="intro__deliverable" id="project-deliverable"></p>
    <div class="intro__csl">
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Challenge</span>
        <p class="intro__csl-body" id="project-challenge"></p>
      </div>
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Solution</span>
        <p class="intro__csl-body" id="project-solution"></p>
      </div>
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Logic</span>
        <p class="intro__csl-body" id="project-logic"></p>
      </div>
    </div>
  </div>

  <div class="image-grid fade-in" id="image-grid">
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
    <div class="image-thumb"></div>
  </div>

  <p class="image-note fade-in" id="image-note"></p>

  <div class="movie-section fade-in">
    <div class="section-header">
      <span class="section-header__label" id="motion-label">Motion</span>
      <div class="section-header__line"></div>
    </div>
    <p class="motion-intro" id="motion-intro"></p>
    <div class="motion-concepts" id="motion-concepts"></div>
    <div id="movie-media"><div class="movie-placeholder"></div></div>
  </div>

  <footer class="page-footer fade-in">
    <div class="footer-line"></div>
    <a class="footer-btn" href="index.html">Back to Work</a>
    <div class="footer-line"></div>
  </footer>

</div>
<script>
  const titleHTML = p.title.replace('\n', '<br>');
  document.getElementById('project-category').textContent = p.categoryLabel || p.tags.map(t => t.charAt(0).toUpperCase() + t.slice(1)).join(' / ');
  document.getElementById('project-title').innerHTML = titleHTML;
  document.getElementById('project-deliverable').textContent = p.deliverable || '';
  document.getElementById('project-challenge').textContent = p.challenge || '';
  document.getElementById('project-solution').textContent = p.solution || '';
  document.getElementById('project-logic').textContent = p.logic || '';
  if (p.imageNote) {
    document.getElementById('image-note').textContent = p.imageNote;
  }

  if (p.motionSection) {
    document.getElementById('motion-label').textContent = 'Motion';
    document.getElementById('motion-intro').style.display = 'none';
    document.getElementById('motion-concepts').innerHTML = p.motionSection.concepts
      .map(c => `<div><p class="motion-concept__title">${c.title}</p><p class="motion-concept__body">${c.body}</p></div>`)
      .join('');
  } else {
    document.querySelector('.movie-section .section-header').style.display = 'none';
    document.getElementById('motion-intro').style.display = 'none';
    document.getElementById('motion-concepts').style.display = 'none';
  }

  if (p.images && p.images.length) {
    document.getElementById('image-grid').innerHTML = p.images
      .map(src => `<img class="image-thumb" src="${src}" loading="eager" alt="">`)
      .join('');
  }

  if (p.videos && p.videos.length) {
    document.getElementById('movie-media').innerHTML = p.videos
      .map(v => `<div class="video-embed" style="aspect-ratio:${v.ratio || '4/5'}"><iframe src="https://player.vimeo.com/video/${v.id}?title=0&byline=0&portrait=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`)
      .join('');
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('animate-in');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });

  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
</body>
</html>
