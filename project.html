<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creative design and motion work by Eric Zunkley for broadcast, film, and digital platforms.">
  <meta property="og:title" content="Eric Zunkley — Designer & Motion Artist">
  <meta property="og:description" content="Creative design and motion work for major brands and film studios.">
  <meta property="og:type" content="website">
  <title>Project</title>
  <link rel="icon" type="image/png" href="images/icon_yang.png">
  <link rel="preload" href="fonts/PPKyoto-Medium.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/PPMori-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="fonts/PPMori-SemiBold.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <script src="projects.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id') || 'a-little-flexibility';
    const p = window.PROJECTS[id];
    if (!p) { location.href = 'index.html'; }
    else {
      document.title = 'Eric Zunkley — ' + p.title.replace('\n', ' ');
      document.querySelector('meta[name="description"]').setAttribute('content', p.shortDescription || 'Creative work by Eric Zunkley');
    }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CreativeWork",
    "creator": {
      "@type": "Person",
      "name": "Eric Zunkley",
      "url": "https://ericzunkley.com"
    },
    "description": "Creative design and motion work"
  }
  </script>
</head>
<body>
<div class="site-bar">
  <button class="site-bar__email" id="email-btn" aria-label="Email Eric Zunkley">
    <img class="email-default" src="images/email_icon.svg" alt="Email">
    <img class="email-hover" src="images/email_icon_hover.svg" alt="Email">
  </button>
</div>

<!-- Contact Modal -->
<div id="contact-modal" class="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
  <div class="contact-modal__overlay"></div>
  <button class="contact-modal__close" id="close-modal" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
  <div class="contact-modal__content">
    <h2 class="contact-modal__title" id="contact-modal-title">Get In Touch</h2>
    <form id="contact-form" class="contact-form">
      <input class="contact-form__honey" type="text" name="_honey" tabindex="-1" autocomplete="off">
      <div class="form-group">
        <label for="contact-name" class="sr-only">Your name</label>
        <input type="text" id="contact-name" name="name" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label for="contact-email" class="sr-only">Your email</label>
        <input type="email" id="contact-email" name="email" placeholder="Your email" required>
      </div>
      <div class="form-group">
        <label for="contact-subject" class="sr-only">Subject</label>
        <input type="text" id="contact-subject" name="subject" placeholder="Subject" required>
      </div>
      <div class="form-group">
        <label for="contact-message" class="sr-only">Message</label>
        <textarea id="contact-message" name="message" placeholder="Message" rows="5" required></textarea>
      </div>
      <button type="submit" class="contact-form__submit">Send</button>
      <p class="contact-form__status" id="form-status" aria-live="polite"></p>
    </form>
  </div>
</div>
<a id="nav-prev" class="project-nav-btn project-nav-btn--prev">
  <img src="images/arrow.svg" alt="Previous project">
</a>
<a id="nav-next" class="project-nav-btn project-nav-btn--next">
  <img src="images/arrow.svg" alt="Next project">
</a>
<div class="page">

  <div class="section-header fade-in">
    <span class="section-header__label" id="project-category">Project</span>
    <div class="section-header__line"></div>
  </div>

  <div class="intro fade-in">
    <h1 class="intro__title" id="project-title"></h1>
    <p class="intro__deliverable" id="project-deliverable"></p>
    <div class="intro__csl">
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Challenge</span>
        <p class="intro__csl-body" id="project-challenge"></p>
      </div>
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Solution</span>
        <p class="intro__csl-body" id="project-solution"></p>
      </div>
      <div class="intro__csl-item">
        <span class="intro__csl-label">The Logic</span>
        <p class="intro__csl-body" id="project-logic"></p>
      </div>
    </div>
  </div>

  <div class="image-grid fade-in" id="image-grid"></div>

  <div class="movie-section fade-in">
    <div class="section-header fade-in">
      <span class="section-header__label" id="motion-label">Motion</span>
      <div class="section-header__line"></div>
    </div>
    <p class="motion-intro" id="motion-intro"></p>
    <div class="motion-concepts" id="motion-concepts"></div>
    <div id="movie-media"><div class="movie-placeholder"></div></div>
  </div>

  <footer class="page-footer">
    <div class="footer-line"></div>
    <a class="footer-btn" href="index.html">Return to Main</a>
    <div class="footer-line"></div>
  </footer>

</div>
<script src="project.js"></script>
<script src="animations.js"></script>
<script src="contact.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
